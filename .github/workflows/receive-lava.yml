name: UPS Validation

on:
  repository_dispatch:
    types: [lava-trigger]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Branch
        run: |
          BRANCH=auto-${{ github.event.client_payload.xship }}
          git checkout -b $BRANCH
          echo "Created branch: $BRANCH"

      - name: Receive Value
        run: |
          echo "Received XSHIP:"
          echo "${{ github.event.client_payload.xship }}"

      - name: Modify validation.json
        run: |
          cat > validation.json <<EOF
          {
            "xship": "${{ github.event.client_payload.xship }}"
          }
          EOF

      - name: Run Validation
        run: |
          echo "Validating..."

          VALUE=$(cat validation.txt)

          if [ -z "$VALUE" ]; then
            echo "Validation Failed"
            exit 1
          fi

          echo "Validation Passed"

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add validation.txt
          git commit -m "UPS validation for ${{ github.event.client_payload.xship }}"

      - name: Push Branch
        run: |
          git push origin HEAD

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "UPS Validation - ${{ github.event.client_payload.xship }}" \
            --body "Automatically generated after LAVA trigger." \
            --base main