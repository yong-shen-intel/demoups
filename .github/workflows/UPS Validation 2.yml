name: UPS Validation

on:
  repository_dispatch:
    types: [lava-trigger]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create branch
        run: |
          BRANCH=auto-${{ github.run_id }}

          git config user.name github-actions
          git config user.email github-actions@github.com

          git checkout -b $BRANCH

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Update DIB file
        env:
          BM_PATH: ${{ github.event.client_payload.path }}
        run: |
          python << 'EOF'
          from pathlib import Path
          import os
          import re

          notebook = Path("NVL_U8C_26WW25P4_A0PO_Integ5_UpdateLineItems.dib")

          text = notebook.read_text(encoding="utf-8")

          new_path = os.environ["BM_PATH"] + r"\flexboms\Release V1.0.0"

          text = re.sub(
              r'@"\\\\amr\.corp\.intel\.com[^"]*"',
              f'@"{new_path}"',
              text
          )

          notebook.write_text(text, encoding="utf-8")

          print("Updated notebook")
          EOF

      - name: Verify
        run: |
          grep "SetAllFromFlexBomLavaRelease" PT_VMIN_UPSVF_update.dib

      # Replace with actual notebook run
      - name: Run notebook validation
        run: |
          echo "Run PT_VMIN_UPSVF_update.dib here"

      - name: Commit
        run: |
          git add PT_VMIN_UPSVF_update.dib
          git commit -m "Auto update DIB path" || echo "No changes"

      - name: Push
        run: |
          git push origin $BRANCH
