name: UPS Validation 2

on:
  repository_dispatch:
    types: [lava-trigger]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create branch
        run: |
          BRANCH=auto-${{ github.run_id }}
          git checkout -b $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Update dib notebook
        env:
          BM_PATH: ${{ github.event.client_payload.path }}
        run: |
          python << 'EOF'
          from pathlib import Path
          import re
          import os

          notebook = Path("NVL_U8C_26WW25P4_A0PO_Integ5_UpdateLineItems.dib")

          text = notebook.read_text(encoding="utf-8")

          new_path = os.environ["BM_PATH"] + r"\flexboms\Release V1.0.0"

          replacement = (
              f'ups.SetAllFromFlexBomLavaRelease(@"{new_path}")'
          )

          text = re.sub(
              r'ups\.SetAllFromFlexBomLavaRelease\(@".*?"\)',
              replacement,
              text
          )

          notebook.write_text(text, encoding="utf-8")
          EOF

      - name: Verify
        run: |
          grep -n "SetAllFromFlexBomLavaRelease" PT_VMIN_UPSVF_update.dib

      # run your dib notebook here

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add PT_VMIN_UPSVF_update.dib
          git commit -m "Update DIB path"

      - name: Push
        run: |
          git push origin $BRANCH
